<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <meta name="theme-color" content="#0f0f1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ScanPrezzo">
  <meta name="description" content="Scannerizza codici a barre e modifica i prezzi dei prodotti in tempo reale">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <title>ScanPrezzo - Scanner & Modifica Prezzi</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-content">
        <div class="logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
            <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
          </svg>
          <span>ScanPrezzo</span>
        </div>
        <button class="btn-icon" id="btn-clear-all" title="Cancella tutto">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
        </button>
      </div>
    </header>
    <main class="main">
      <section class="scanner-section">
        <div class="scanner-card">
          <div class="scanner-header">
            <h2>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                <circle cx="12" cy="13" r="4"></circle>
              </svg>
              Scannerizza Codice
            </h2>
            <p>Inquadra il codice a barre con la fotocamera</p>
          </div>
          <div class="scanner-viewport">
            <div id="reader"></div>
            <div class="scan-overlay">
              <div class="scan-frame">
                <div class="corner-tl"></div>
                <div class="corner-tr"></div>
                <div class="corner-bl"></div>
                <div class="corner-br"></div>
                <div class="scan-line"></div>
              </div>
              <div class="scan-hint">Posiziona il codice nel riquadro</div>
            </div>
          </div>
          <div class="scanner-actions">
            <button class="btn-toggle" id="btn-toggle-scan">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="23 7 16 12 23 17 23 7"></polygon>
                <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
              </svg>
              <span>Avvia Scanner</span>
            </button>
            <button class="btn-file" id="btn-file">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="16" y1="13" x2="8" y2="13"></line>
                <line x1="16" y1="17" x2="8" y2="17"></line>
                <polyline points="10 9 9 9 8 9"></polyline>
              </svg>
              <span>Carica Immagine</span>
            </button>
            <input type="file" id="file-input" accept="image/*" style="display:none">
          </div>
          <div class="manual-input">
            <label>Inserisci codice manualmente</label>
            <div class="manual-row">
              <input type="text" id="manual-barcode" placeholder="Es: 8001234567890">
              <button class="btn-manual" id="btn-manual">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="12" y1="5" x2="12" y2="19"></line>
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                <span>Aggiungi</span>
              </button>
            </div>
          </div>
          <div class="last-scan" id="last-scan" style="display:none">
            <div class="last-scan-label">Ultima scansione</div>
            <div class="last-scan-value" id="last-scan-value"></div>
          </div>
        </div>
      </section>
      <section class="products-section">
        <div class="section-header">
          <h2>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <path d="M16 10a4 4 0 0 1-8 0"></path>
            </svg>
            Prodotti Scansionati
          </h2>
          <span class="count" id="product-count">0</span>
        </div>
        <div class="products-list" id="products-list">
          <div class="empty-state">
            <div class="empty-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
                <line x1="1" y1="10" x2="23" y2="10"></line>
              </svg>
            </div>
            <h3>Nessun prodotto ancora</h3>
            <p>Scannerizza un codice a barre per iniziare a modificare i prezzi</p>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div class="modal" id="modal">
    <div class="modal-backdrop"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h3>Modifica Prezzo</h3>
        <button class="modal-close" id="modal-close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="product-info">
          <div class="product-barcode">
            <label>Codice a Barre</label>
            <div class="barcode-value" id="modal-barcode"></div>
          </div>
          <div class="product-name">
            <label>Nome Prodotto</label>
            <input type="text" id="modal-name" placeholder="Inserisci nome prodotto">
          </div>
          <div class="price-row">
            <div class="price-group">
              <label>Prezzo Originale (€)</label>
              <input type="number" id="modal-original" step="0.01" min="0" placeholder="0,00">
            </div>
            <div class="price-arrow">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
              </svg>
            </div>
            <div class="price-group">
              <label>Prezzo Nuovo (€)</label>
              <input type="number" id="modal-new" step="0.01" min="0" placeholder="0,00">
            </div>
          </div>
          <div class="price-diff" id="price-diff"></div>
          <div class="discount-row">
            <label>Sconto (%)</label>
            <div class="discount-inputs">
              <input type="number" id="modal-discount" step="1" min="0" max="100" placeholder="0">
              <button class="btn-apply-discount" id="btn-apply-discount">Applica</button>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" id="btn-cancel">Annulla</button>
        <button class="btn-primary" id="btn-save">Salva Modifiche</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">
    <div class="toast-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>
    <div class="toast-message" id="toast-message">Prodotto salvato!</div>
  </div>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log('SW registered'))
        .catch(e => console.log('SW error', e));
    }
  </script>
</body>
</html>
